<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page - Ride Coverage</title>
    <!-- Importação do Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
body>

    <!-- Header / Barra de Navegação -->
    <header class="navbar">
        <nav class="nav-links">
            <a href="#">Product</a>
            <a href="#">Company</a>
            <a href="#">Blog</a>
            <a href="#">Log in</a>
        </nav>
        <a href="#" class="btn-signup">Sign up</a>
    </header>

    <!-- Conteúdo Principal (Hero Section) -->
    <main class="hero-container">
        
        <!-- Lado Esquerdo: Ilustração Limpa -->
        <div class="hero-image-container">
            <div class="green-bg-shape">
                <!-- Substitua pelo caminho real da sua imagem limpa do casal -->
                <img src="./img/Desafio.png" alt="Ilustração do casal acenando" class="hero-image">
            </div>
        </div>

        <!-- Lado Direito: Textos e Descrições -->
        <div class="hero-content">
            <h1 class="hero-title">Wide coverage location</h1>
            <p class="hero-description">
                Shared rides. There's lots to do in your city, and we've got the rides to help you enjoy it all. And they're available right from your app.
            </p>
            <a href="#" class="learn-more-link">Learn more &rarr;</a>
        </div>

    </main>

</body>
</html>
